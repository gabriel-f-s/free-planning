services:
  db:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=freeplanning'
      - 'POSTGRES_PASSWORD=${SUN_DATABASE_PASSWORD}'
      - 'POSTGRES_USER=${SUN_DATABASE_USERNAME}'
    ports:
      - '5435:5432'

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - 'SPRING_DATASOURCE_URL='
      - 'SPRING_DATASOURCE_USERNAME=${SUN_DATABASE_USERNAME}'
      - 'SPRING_DATASOURCE_PASSWORD=${SUN_DATABASE_PASSWORD}'
    depends_on:
      - 'db'